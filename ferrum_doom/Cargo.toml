[package]
name = "ferrum_doom"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "rlib"]

[build-dependencies]
bindgen = "0.71"
cc = "1.0"
[profile.dev]
opt-level = 2

[profile.release]
opt-level = 1
debug-assertions = false
overflow-checks = false

[dependencies]
rustysynth = "1.3"
